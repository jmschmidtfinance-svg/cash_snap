name: Daily cash snap

on:
  # 2026-10-01: the GitHub cron ("30 5 * * *") was firing 4-6 hours late every day
  # (runs landed 09:38Z-11:50Z through late September), so the daily run is now started
  # by a Claude scheduled task ("Cash snap - 2am ET dispatch") via workflow_dispatch at
  # 1:57am US/Eastern. Jamie needs the email by 6:30am ET. The schedule block is removed
  # so the delayed cron cannot send a second copy of the same day. report_date still
  # defaults to "yesterday"; a missed run self-heals because the roll-forward reconciles
  # against the last *logged* balance over whatever gap occurred.
  workflow_dispatch:
    inputs:
      report_date:
        description: "Override report date (YYYY-MM-DD). Leave blank for yesterday."
        required: false
        default: ""

# Needed so the job can commit the persisted state file (state/cash_state.json) back to the repo.
permissions:
  contents: write

jobs:
  cash-snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run cash snap
        env:
          NS_ACCOUNT_ID:     ${{ secrets.NS_ACCOUNT_ID }}
          NS_CONSUMER_KEY:   ${{ secrets.NS_CONSUMER_KEY }}
          NS_CONSUMER_SECRET: ${{ secrets.NS_CONSUMER_SECRET }}
          NS_TOKEN_ID:       ${{ secrets.NS_TOKEN_ID }}
          NS_TOKEN_SECRET:   ${{ secrets.NS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST:         ${{ secrets.SMTP_HOST }}
          SMTP_PORT:         ${{ secrets.SMTP_PORT }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM:         ${{ secrets.MAIL_FROM }}
          MAIL_TO:           ${{ secrets.MAIL_TO }}
          SNAP_THRESHOLD:    ${{ vars.SNAP_THRESHOLD }}
          CASH_EXTRA_ACCOUNT_IDS: ${{ vars.CASH_EXTRA_ACCOUNT_IDS }}
          REPORT_DATE:       ${{ github.event.inputs.report_date }}
        run: python cash_snap.py

      - name: Persist reported balance (audit ledger)
        if: success()
        run: |
          git config user.name  "cash-snap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/cash_state.json
          git diff --staged --quiet || git commit -m "state: reported cash balance"
          git push
